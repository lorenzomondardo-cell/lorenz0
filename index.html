<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Universo Marvel</title>
    <style>
        /* --- ESTILO VISUAL (CSS) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            background-image: radial-gradient(#330000 20%, #111111 80%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: #222222;
            border: 2px solid #f0131e; /* Vermelho Marvel */
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(240, 19, 30, 0.2);
            width: 550px;
            max-width: 100%;
            padding: 30px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            line-height: 1.4;
        }

        .imagem-exibicao {
            max-width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
            display: none;
        }

        .btn-resposta {
            background-color: #333333;
            color: #ffffff;
            border: 2px solid #555555;
            border-radius: 6px;
            padding: 14px;
            margin: 10px 0;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .btn-resposta:hover:not([disabled]) {
            border-color: #f0131e;
            background-color: #2b2b2b;
        }

        #btn-proximo {
            background-color: #f0131e;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        #btn-proximo:hover {
            background-color: #b80f17;
        }

        .escondido {
            display: none;
        }

        #resultado {
            font-size: 18px;
            line-height: 1.6;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #2d2d2d;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz-header">
            <h2 id="pergunta">Carregando pergunta...</h2>
            <img id="imagem-quiz" class="imagem-exibicao" src="" alt="Imagem do Quiz">
        </div>
        <div id="opcoes-respostas"></div>
        <button id="btn-proximo" class="escondido">Próxima Pergunta</button>
        <div id="resultado" class="escondido"></div>
    </div>

    <script>
        // --- LÓGICA DO JOGO (JAVASCRIPT) ---
        const perguntasQuiz = [
            {
                pergunta: "Qual é o primeiro filme oficial do Universo Cinematográfico da Marvel (MCU)?",
                opcoes: ["Capitão América: O Primeiro Vingador", "Homem de Ferro", "Thor", "O Incrível Hulk"],
                correta: 1,
                imagem: "https://images.unsplash.com/photo-1608889174636-8db851145f22?w=500&q=80"
            },
            {
                pergunta: "De qual metal fictício é feito o escudo do Capitão América e o traje do Pantera Negra?",
                opcoes: ["Adamantium", "Kryptonita", "Vibranium", "Mithril"],
                correta: 2,
                imagem: "https://images.unsplash.com/photo-1620336655055-088d06e36bf0?w=500&q=80"
            },
            {
                pergunta: "Quantas Joias do Infinito existem no universo da Marvel?",
                opcoes: ["5", "6", "7", "4"],
                correta: 1,
                imagem: "https://images.unsplash.com/photo-1596727147705-61a532a659bd?w=500&q=80"
            },
            {
                pergunta: "Qual é o nome verdadeiro do herói conhecido como Gavião Arqueiro?",
                opcoes: ["Clint Barton", "Phil Coulson", "Bruce Banner", "Sam Wilson"],
                correta: 0,
                imagem: "https://images.unsplash.com/photo-1608889175123-8ec330b86f84?w=500&q=80"
            },
            {
                pergunta: "Em qual planeta Thanos encontra a Joia da Alma em 'Vingadores: Guerra Infinita'?",
                opcoes: ["Asgard", "Xandar", "Vormir", "Titan"],
                correta: 2,
                imagem: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&q=80"
            },
            {
                pergunta: "Quem é o diretor da S.H.I.E.L.D. que reúne os Vingadores pela primeira vez?",
                opcoes: ["Nick Fury", "Phil Coulson", "Tony Stark", "Alexander Pierce"],
                correta: 0,
                imagem: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&q=80"
            },
            {
                pergunta: "Qual é o nome da inteligência artificial criada por Tony Stark que depois ganha um corpo físico?",
                opcoes: ["J.A.R.V.I.S.", "F.R.I.D.A.Y.", "Ultron", "Visão"],
                correta: 2,
                imagem: "https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?w=500&q=80"
            },
            {
                pergunta: "Em 'Thor: Ragnarok', qual inteligência ou ser controla o planeta Sakaar?",
                opcoes: ["Loki", "O Grão-Mestre", "Hela", "O Colecionador"],
                correta: 1,
                imagem: "https://images.unsplash.com/photo-1618005198143-e5283b019a72?w=500&q=80"
            },
            {
                pergunta: "Qual é a música marcante que toca na abertura de 'Guardiões da Galáxia Vol. 1' enquanto Peter Quill dança?",
                opcoes: ["Come and Get Your Love", "Hooked on a Feeling", "Mr. Blue Sky", "Cherry Bomb"],
                correta: 1,
                imagem: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80"
            },
            {
                pergunta: "Quem é o verdadeiro vilão por trás dos acontecimentos da série 'WandaVision'?",
                opcoes: ["Agatha Harkness", "Mephisto", "Tyler Hayward", "Monica Rambeau"],
                correta: 0,
                imagem: "https://images.unsplash.com/photo-1509248961158-e54f6934749c?w=500&q=80"
            },
            {
                pergunta: "Qual Peter Parker é conhecido como 'Peter-Dois' no filme 'Homem-Aranha: Sem Volta Para Casa'?",
                opcoes: ["Tom Holland", "Andrew Garfield", "Tobey Maguire", "Miles Morales"],
                correta: 2,
                imagem: "https://images.unsplash.com/photo-1635805737707-575885ab0820?w=500&q=80"
            },
            {
                pergunta: "Antes de se tornar o Doutor Estranho, qual era a profissão de Stephen Strange?",
                opcoes: ["Cientista Político", "Neurocirurgião", "Engenheiro Aeroespacial", "Físico Quântico"],
                correta: 1,
                imagem: "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?w=500&q=80"
            },
            {
                pergunta: "Qual é o nome da dimensão para onde o Homem-Formiga vai quando encolhe além do nível subatômico?",
                opcoes: ["Reino Quântico", "Zona Negativa", "Dimensão Espelhada", "Microverso"],
                correta: 0,
                imagem: "https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?w=500&q=80"
            },
            {
                pergunta: "Qual personagem se sacrifica para que os Vingadores consigam a Joia da Alma em 'Vingadores: Ultimato'?",
                opcoes: ["Gamora", "Nebulosa", "Viúva Negra (Natasha)", "Homem de Ferro"],
                correta: 2,
                imagem: "https://images.unsplash.com/photo-1518156677180-95a2893f3e9f?w=500&q=80"
            },
            {
                pergunta: "Quem é o irmão adotivo de Thor e o Deus da Trapaça?",
                opcoes: ["Odin", "Loki", "Heimdall", "Malekith"],
                correta: 1,
                imagem: "https://images.unsplash.com/photo-1601987177651-8edfe6c20009?w=500&q=80"
            },
            {
                pergunta: "Em 'Pantera Negra', qual é o nome do principal rival e primo de T'Challa que tenta assumir o trono?",
                opcoes: ["M'Baku", "Erik Killmonger", "W'Kabi", "Zemo"],
                correta: 1,
                imagem: "https://images.unsplash.com/photo-1501472312651-726afe119ff1?w=500&q=80"
            }
        ];

        let perguntaAtual = 0;
        let pontuacao = 0;

        const elementoPergunta = document.getElementById('pergunta');
        const elementoImagem = document.getElementById('imagem-quiz');
        const containerRespostas = document.getElementById('opcoes-respostas');
        const btnProximo = document.getElementById('btn-proximo');
        const elementoResultado = document.getElementById('resultado');

        function iniciarQuiz() {
            perguntaAtual = 0;
            pontuacao = 0;
            btnProximo.innerText = "Próxima Pergunta";
            btnProximo.onclick = avançarPergunta;
            mostrarPergunta();
        }

        function mostrarPergunta() {
            resetarEstado();
            let questao = perguntasQuiz[perguntaAtual];
            elementoPergunta.innerText = questao.pergunta;

            if (questao.imagem) {
                elementoImagem.src = questao.imagem;
                elementoImagem.style.display = "block";
            } else {
                elementoImagem.style.display = "none";
            }

            questao.opcoes.forEach((opcao, indice) => {
                const botao = document.createElement('button');
                botao.innerText = opcao;
                botao.classList.add('btn-resposta');
                botao.addEventListener('click', () => selecionarResposta(indice));
                containerRespostas.appendChild(botao);
            });
        }

        function resetarEstado() {
            btnProximo.classList.add('escondido');
            while (containerRespostas.firstChild) {
                containerRespostas.removeChild(containerRespostas.firstChild);
            }
        }

        function selecionarResposta(indiceSelecionado) {
            let questao = perguntasQuiz[perguntaAtual];
            const botoes = containerRespostas.querySelectorAll('.btn-resposta');
            
            botoes.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === questao.correta) {
                    btn.style.backgroundColor = '#28a745'; // Verde para acerto
                    btn.style.borderColor = '#28a745';
                } else if (idx === indiceSelecionado) {
                    btn.style.backgroundColor = '#dc3545'; // Vermelho para erro
                    btn.style.borderColor = '#dc3545';
                }
            });

            if (indiceSelecionado === questao.correta) {
                pontuacao++;
            }

            btnProximo.classList.remove('escondido');
        }

        function avançarPergunta() {
            perguntaAtual++;
            if (perguntaAtual < perguntasQuiz.length) {
                mostrarPergunta();
            } else {
                mostrarResultado();
            }
        }

        function mostrarResultado() {
            resetarEstado();
            elementoPergunta.innerText = "Quiz Concluído!";
            
            const porcentagemAcertos = (pontuacao / perguntasQuiz.length) * 100;
            let mensagemFinal = "";
            let imagemFinalUrl = "";

            // Lógica de validação com imagens correspondentes aos resultados
            if (pontuacao === 0) {
                mensagemFinal = "Você errou todas as perguntas, você não é um verdadeiro fã do universo marvel.";
                imagemFinalUrl = "https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=500&q=80"; // Imagem sombria/derrota
            } else if (porcentagemAcertos === 50) {
                mensagemFinal = "Opa, parece que temos um fã mediano do universo marvel, meus parabéns por acertar 50% das perguntas.";
                imagemFinalUrl = "https://images.unsplash.com/photo-1601987177651-8edfe6c20009?w=500&q=80"; // Imagem neutra/Loki
            } else if (pontuacao === perguntasQuiz.length) {
                mensagemFinal = "Meus parabéns, parece que temos um fã verdadeiro do universo marvel.";
                imagemFinalUrl = "https://images.unsplash.com/photo-1569003339405-ea396a5a8a90?w=500&q=80"; // Imagem heroica/vitória
            } else {
                mensagemFinal = `Você acertou ${pontuacao} de ${perguntasQuiz.length} perguntas sobre a Marvel!`;
                imagemFinalUrl = "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&q=80"; // Imagem padrão de encerramento
            }

            // Atualiza a imagem da tela final
            elementoImagem.src = imagemFinalUrl;
            elementoImagem.style.display = "block";

            elementoResultado.innerText = mensagemFinal;
            elementoResultado.classList.remove('escondido');
            
            btnProximo.innerText = "Reiniciar Quiz";
            btnProximo.classList.remove('escondido');
            btnProximo.onclick = () => {
                elementoResultado.classList.add('escondido');
                iniciarQuiz();
            };
        }

        // Inicia o quiz automaticamente
        iniciarQuiz();
    </script>
</body>
</html>
